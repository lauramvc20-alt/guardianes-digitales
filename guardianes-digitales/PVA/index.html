<body>
  <a class="skip-link" href="#view">Saltar al contenido principal</a>

  <div class="app" id="app">
    <aside class="rail" id="rail" aria-label="Navegación del curso">
      <a class="rail__brand" href="#/" aria-label="PVA · Guardián digital: ir al panel del estudiante">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <strong>PVA</strong>
          <small>Guardián digital</small>
        </span>
      </a>

      <button class="rail__collapse" type="button" id="railToggle" aria-controls="rail" aria-label="Ocultar el panel lateral" title="Ocultar panel">
        <span id="railToggleIcon" aria-hidden="true"></span>
      </button>

      <nav class="rail__nav" id="nav" aria-label="Ruta del curso"></nav>

      <div class="rail__foot">
        <div class="mini-progress" id="railProgress"></div>
        <div class="rail__controls">
          <button class="rail__reset" type="button" id="resetBtn">
            <span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></span> Reiniciar recorrido
          </button>
          <button class="icon-btn rail__sound" type="button" id="soundBtn" aria-pressed="false" title="Activar o silenciar sonidos">
            <span id="soundIcon" aria-hidden="true"></span>
            <span class="sr-only">Sonido</span>
          </button>
        </div>
        <p class="rail__note">Tu avance se guarda en este navegador y dispositivo.</p>
      </div>
    </aside>

    <button class="rail-open" type="button" id="railOpen" aria-controls="rail" aria-expanded="false" aria-label="Mostrar el panel lateral" title="Mostrar panel" hidden>
      <span id="railOpenIcon" aria-hidden="true"></span><span class="rail-open__t">Menú</span>
    </button>

    <div class="shell">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" id="menuBtn" aria-expanded="false" aria-controls="rail" aria-label="Abrir menú del curso">
          <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <div class="topbar__where">
          <span class="dot" aria-hidden="true"></span>
          <span id="crumb">Panel del estudiante</span>
        </div>
      </header>

      <main id="view" tabindex="-1" aria-live="polite"></main>

      <footer class="foot">
        <p>
          Proyecto final, Cátedra Pablos Oliveros, Ingeniería de Sistemas, Fundación Universitaria del Área Andina. (2026).
        </p>
      </footer>
    </div>
  </div>

<button type="button" class="theme-fab print-hide" id="theme-toggle" aria-label="Cambiar entre modo claro y modo oscuro">
    <span id="theme-icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
    <span id="theme-label">Modo claro</span>
  </button>
  <script>
    (function () {
      const KEY = 'pva_theme_v1';
      const btn = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      const SUN = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
      const MOON = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
      function applyTheme(t) {
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          if (icon) icon.innerHTML = MOON;
          if (label) label.textContent = 'Modo oscuro';
        } else {
          document.documentElement.removeAttribute('data-theme');
          if (icon) icon.innerHTML = SUN;
          if (label) label.textContent = 'Modo claro';
        }
      }
      applyTheme(localStorage.getItem(KEY) || 'dark');
      if (btn) {
        btn.addEventListener('click', function () {
          const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          localStorage.setItem(KEY, next);
          applyTheme(next);
        });
      }
    })();
  </script>
